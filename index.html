<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NL</title>
    <link rel="icon" type="image/jpeg" href="/images/profile_img.jpg" />
    <script>
      (function() {
        try {
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(v) { 
              console.warn('Attempted to overwrite window.fetch, ignoring to prevent crash.');
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // If we can't define it (e.g. not configurable), at least we tried
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
