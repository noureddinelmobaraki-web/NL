    <script>
      // Safe guard fetch property mutation for embedded/iframe environments
      (function() {
        try {
          let originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(val) {
              originalFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // non-blocking fallback
        }
      })();

      // FOUC Fix: Synchronously apply saved theme before paint
      (function() {
        try {
          const raw = localStorage.getItem('nl-prefs-v1');
          if (raw) {
            const saved = JSON.parse(raw);
            if (saved && saved.theme && ['dark', 'light', 'bit', 'midnight', 'lite', 'retro'].includes(saved.theme)) {
              document.documentElement.setAttribute('data-theme', saved.theme);
            } else {
              document.documentElement.setAttribute('data-theme', 'midnight');
            }
          } else {
            document.documentElement.setAttribute('data-theme', 'midnight');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'midnight');
        }
      })();
