name: Code Quality & Integrity CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Run Rollup Visualizer (Analyze)
        run: npm run analyze

      - name: Upload Rollup Stats Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rollup-stats
          path: stats.html
          if-no-files-found: error

      - name: Run Custom Quality Verification Checks
        run: node scripts/verify-build.mjs

      - name: Run Lighthouse Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
