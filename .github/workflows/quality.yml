name: Code Quality & Integrity CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # يسمح بتشغيل يدوي من تبويب Actions

# منع تشغيل عدة instances متوازية لنفس الـ branch
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  quality:
    name: Build & Validate
    runs-on: ubuntu-24.04  # ثابت بدل latest لتجنب مفاجآت runner changes
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: 'npm'


      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Linter
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Run Rollup Visualizer (Analyze)
        run: npm run analyze

      - name: Upload Rollup Stats Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rollup-stats
          path: stats.html
          if-no-files-found: error
          retention-days: 14

      - name: Run Custom Quality Verification Checks
        run: node scripts/verify-build.mjs

      - name: Run Lighthouse Audit
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true  # لا تُفشِل الـ workflow إذا Lighthouse رمى warning
        with:
          configPath: ./.lighthouserc.json
