<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#245dd7" />
      <stop offset="40%" stop-color="#144d97" />
      <stop offset="85%" stop-color="#021c43" />
      <stop offset="100%" stop-color="#010612" />
    </radialGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#245dd7" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <circle cx="24" cy="24" r="22" fill="url(#discGrad)" stroke="#245dd7" stroke-width="1" />
  <circle cx="24" cy="24" r="21" fill="url(#shine)" />
  <circle cx="24" cy="24" r="14" fill="none" stroke="#3a95ff" stroke-width="1.5" stroke-dasharray="29 10" />
  
  <!-- Silver Hub -->
  <circle cx="24" cy="24" r="7" fill="#bcbcbc" stroke="#ffffff" stroke-width="1" />
  <circle cx="24" cy="24" r="3" fill="#144d97" />

  <!-- Classic Orange Play Arrow -->
  <path d="M 19 15 L 34 24 L 19 33 Z" fill="url(#playGrad)" stroke="#cc3300" stroke-width="1" stroke-linejoin="round" />
  <!-- Gloss overlay on play -->
  <path d="M 19 15 L 29 24 L 19 24 Z" fill="#ffffff" fill-opacity="0.25" />
</svg>
