<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- XP-style Filmstrip Icon (xpvideos) -->
  <defs>
    <linearGradient id="xp-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#003399"/>
    </linearGradient>
    <linearGradient id="xp-gold-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Film/Movie border -->
  <rect x="4" y="6" width="40" height="36" rx="4" fill="url(#xp-blue-grad)" stroke="#FFFFFF" stroke-width="2" />
  
  <!-- Filmstrip holes on top -->
  <rect x="8" y="9" width="4" height="4" rx="1" fill="#FFFFFF" />
  <rect x="16" y="9" width="4" height="4" rx="1" fill="#FFFFFF" />
  <rect x="24" y="9" width="4" height="4" rx="1" fill="#FFFFFF" />
  <rect x="32" y="9" width="4" height="4" rx="1" fill="#FFFFFF" />
  <rect x="40" y="9" width="4" height="4" rx="1" fill="#FFFFFF" />
  
  <!-- Filmstrip holes on bottom -->
  <rect x="8" y="35" width="4" height="4" rx="1" fill="#FFFFFF" />
  <rect x="16" y="35" width="4" height="4" rx="1" fill="#FFFFFF" />
  <rect x="24" y="35" width="4" height="4" rx="1" fill="#FFFFFF" />
  <rect x="32" y="35" width="4" height="4" rx="1" fill="#FFFFFF" />
  <rect x="40" y="35" width="4" height="4" rx="1" fill="#FFFFFF" />
  
  <!-- Screen Area -->
  <rect x="8" y="16" width="32" height="16" fill="#001c57" rx="1" />
  
  <!-- Play Symbol (Gold Triangle) -->
  <polygon points="20,20 20,28 29,24" fill="url(#xp-gold-grad)" stroke="#FFFFFF" stroke-width="1" />
</svg>
