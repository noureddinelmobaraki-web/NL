<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- XP-style Social 3 Overlapping Circles Icon (xpsocial) -->
  <defs>
    <!-- XP blue profile -->
    <linearGradient id="circ-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2980B9"/>
      <stop offset="100%" stop-color="#1F4E79"/>
    </linearGradient>
    <!-- XP green profile -->
    <linearGradient id="circ-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40C057"/>
      <stop offset="100%" stop-color="#2B8A3E"/>
    </linearGradient>
    <!-- XP orange/gold profile -->
    <linearGradient id="circ-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF922B"/>
      <stop offset="100%" stop-color="#D9480F"/>
    </linearGradient>
  </defs>

  <!-- Circle 1: Blue -->
  <circle cx="24" cy="18" r="11" fill="url(#circ-blue)" stroke="#FFFFFF" stroke-width="2" />
  
  <!-- Circle 2: Green -->
  <circle cx="15" cy="30" r="11" fill="url(#circ-green)" stroke="#FFFFFF" stroke-width="2" />
  
  <!-- Circle 3: Orange -->
  <circle cx="33" cy="30" r="11" fill="url(#circ-orange)" stroke="#FFFFFF" stroke-width="2" />

  <!-- Add some subtle visual connection lines (links) inside them -->
  <line x1="24" y1="18" x2="15" y2="30" stroke="#FFFFFF" stroke-width="2.5" />
  <line x1="24" y1="18" x2="33" y2="30" stroke="#FFFFFF" stroke-width="2.5" />
  <line x1="15" y1="30" x2="33" y2="30" stroke="#FFFFFF" stroke-width="2.5" />

  <!-- Inner white dots for nodes -->
  <circle cx="24" cy="18" r="3" fill="#FFFFFF" />
  <circle cx="15" cy="30" r="3" fill="#FFFFFF" />
  <circle cx="33" cy="30" r="3" fill="#FFFFFF" />
</svg>
