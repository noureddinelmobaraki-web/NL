<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- XP-style Broadcast Stream Icon (xpstreams) -->
  <defs>
    <linearGradient id="xp-blue-tower" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0054E3"/>
      <stop offset="100%" stop-color="#002d8a"/>
    </linearGradient>
  </defs>

  <!-- Broadcast Tower -->
  <polygon points="24,14 18,44 30,44" fill="url(#xp-blue-tower)" stroke="#FFFFFF" stroke-width="1.5" />
  <line x1="21" y1="24" x2="27" y2="24" stroke="#FFFFFF" stroke-width="1.5" />
  <line x1="20" y1="34" x2="28" y2="34" stroke="#FFFFFF" stroke-width="1.5" />
  
  <!-- Antenna Tip Red Glow -->
  <circle cx="24" cy="11" r="3.5" fill="#FF2400" stroke="#FFFFFF" stroke-width="1" />
  
  <!-- Broadcast Waves (Luna Blue and Gold) -->
  <!-- Left waves -->
  <path d="M17,11 C15,7 15,15 17,21" fill="none" stroke="#0054E3" stroke-width="2" stroke-linecap="round" />
  <path d="M11,6 C7,-1 7,23 11,29" fill="none" stroke="#FFB800" stroke-width="2" stroke-linecap="round" />
  
  <!-- Right waves -->
  <path d="M31,11 C33,7 33,15 31,21" fill="none" stroke="#0054E3" stroke-width="2" stroke-linecap="round" />
  <path d="M37,6 C41,-1 41,23 37,29" fill="none" stroke="#FFB800" stroke-width="2" stroke-linecap="round" stroke-linecap="round" />
  
  <!-- Wave floor/footer representing soundwave -->
  <path d="M4,44 L8,44 L10,38 L14,46 L18,41 L22,46 L26,46 L30,41 L34,46 L38,38 L40,44 L44,44" fill="none" stroke="#3A9D23" stroke-width="2.5" stroke-linejoin="round" />
</svg>
