<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>غير متصل — NL</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #080a14; color: #fff;
           min-height: 100vh; display: grid; place-items: center; margin: 0; }
    .card { text-align: center; padding: 2rem; max-width: 480px; }
    h1 { color: #b8ff3f; margin: 0 0 1rem; }
    button { background: #b8ff3f; color: #080a14; border: 0; padding: 0.75rem 1.5rem;
             font-weight: 700; border-radius: 4px; cursor: pointer; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>أنت غير متصل</h1>
    <p>لا يوجد اتصال إنترنت حالياً. ستُحفظ آخر الأغاني التي شغّلتها للاستماع لاحقاً.</p>
    <button onclick="location.reload()">حاول مجدداً</button>
  </div>
</body>
</html>
