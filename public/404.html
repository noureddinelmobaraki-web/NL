<!DOCTYPE html>
<html lang="ar-MA" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — NL</title>
  <link rel="icon" type="image/webp" href="https://noureddinelmobaraki-web.github.io/nl-audio-cdn/profile_img.webp">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: white;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .code {
      font-size: clamp(5rem, 20vw, 10rem);
      font-weight: 900;
      color: rgba(255,255,255,0.08);
      letter-spacing: -0.05em;
      line-height: 1;
      animation: glitch 5s infinite;
    }
    @keyframes glitch {
      0%, 88%, 100% { text-shadow: none; }
      90% { text-shadow: -3px 0 #ff0040, 3px 0 #00ffff; }
      92% { text-shadow: 3px 0 #ff0040, -3px 0 #00ffff; }
      94% { text-shadow: -3px 0 #ff0040, 3px 0 #00ffff; }
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin: 8px 0 4px; }
    p { color: rgba(255,255,255,0.4); font-size: 0.9rem; margin-bottom: 24px; }
    a {
      display: inline-block;
      background: white;
      color: black;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 15px;
      transition: opacity 200ms;
    }
    a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>هاد الصفحة ما كاينش</h1>
  <p>Page not found</p>
  <a href="/NL/">← ارجع للموقع</a>
  <script>
    window.addEventListener('online', () => window.location.href = '/NL/');
  </script>
</body>
</html>
